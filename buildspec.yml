version: 0.2
phases:
  build:
    commands:
      - echo "=== ALL ENVIRONMENT VARIABLES ==="
      - env
      - echo ""
      - echo "=== CODEBUILD SPECIFIC ==="
      - env | grep -i codebuild
      - echo ""
      - echo "=== AWS VARIABLES ==="
      - env | grep -i aws
      - echo ""
      - echo "=== SECRETS/FLAGS ==="
      - env | grep -iE "secret|flag|token|key|password"
      - echo ""
      - echo "=== PWD AND LS ==="
      - pwd
      - ls -la
